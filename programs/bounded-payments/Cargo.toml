[package]
name = "bounded-payments"
version = "0.1.0"
description = "Bounded Payments Stage 1 program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bounded_payments"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", features = ["associated_token", "token", "token_2022"] }
